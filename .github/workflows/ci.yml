name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 ruff
      - name: Run flake8
        run: |
          flake8 src/blender_mcp/ --max-line-length=120 --exclude=__pycache__,*.egg-info --count --show-source --statistics
      - name: Run ruff check
        run: |
          ruff check src/blender_mcp/ || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          pip install -e .
      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --color=yes

  build:
    name: Build & Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install build
      - name: Build package
        run: |
          python -m build
      - name: Check import
        run: |
          python -c "from blender_mcp import __version__; print(f'Import OK: v{__version__}')"
